# Local development ONLY. No secrets from this file belong in production.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - '127.0.0.1:8765:8765'
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DEBUG: 'true'
      APP_URL: http://localhost:8765
      SECURITY_SALT: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: harfusha_lab_dev
      DB_USER: lab_dev
      DB_PASS: local-only-password
    command: >-
      sh -c 'composer install --no-interaction --prefer-dist &&
             php bin/cake.php migrations migrate --no-interaction &&
             php bin/cake.php server -H 0.0.0.0 -p 8765'
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: harfusha_lab_dev
      MYSQL_USER: lab_dev
      MYSQL_PASSWORD: local-only-password
      MYSQL_ROOT_PASSWORD: root-local-only-password
    volumes:
      - dev_mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL','mysqladmin ping -h localhost -uroot -proot-local-only-password']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  dev_mysql:
