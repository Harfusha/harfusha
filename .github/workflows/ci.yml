name: Verify PHP 8.5 + browser core
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      public_content_approval:
        description: 'After reviewing the current public snapshot, type APPROVE PUBLIC CONTENT'
        required: true
        type: string

permissions:
  contents: read

# Cancel superseded commits within the same event/branch. Push and
# pull_request checks must not cancel one another's independent evidence.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Pin every job to a supported, reproducible runner image rather than
# tracking an automatically changing ubuntu-latest release.
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_DATABASE: harfusha_lab_ci
          MYSQL_USER: lab_ci
          MYSQL_PASSWORD: lab-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      DEBUG: 'false'
      APP_URL: http://localhost:8765
      SECURITY_SALT: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: harfusha_lab_ci
      DB_USER: lab_ci
      LAB_TEST_DB_CONFIRM: harfusha_lab_ci
      DB_PASS: lab-test-only
      GITHUB_LOGIN: Harfusha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_mysql, simplexml, openssl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Require reproducible dependency lockfile
        run: |
          test -f composer.lock || { echo 'composer.lock is required: resolve on PHP 8.5, review, commit'; exit 1; }
          composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer metadata and vulnerabilities
        run: |
          composer validate --strict
          composer audit --locked
      - name: Verify PHP source, public schemas and offline SSR
        run: |
          composer syntax
          composer standalone
          python3 scripts/audit-public.py
          python3 scripts/audit-rendered.py
      - name: Initialize real MySQL schema
        run: php bin/cake.php migrations migrate
      - name: Actual CakePHP HTTP middleware, CSRF and session smoke
        run: |
          export LAB_SMOKE_ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(36))')"
          export ADMIN_PASSWORD_HASH="$(php -r 'echo password_hash(getenv("LAB_SMOKE_ADMIN_PASSWORD"), PASSWORD_DEFAULT);')"
          php -S 127.0.0.1:8765 -t webroot webroot/index.php > /tmp/harfusha-http.log 2>&1 &
          echo $! > /tmp/harfusha-http.pid
          trap 'kill $(cat /tmp/harfusha-http.pid) 2>/dev/null || true' EXIT
          if ! python3 scripts/http-smoke.py; then
            echo 'CakePHP HTTP smoke failed; last server log lines:'
            tail -n 120 /tmp/harfusha-http.log
            exit 1
          fi
      - name: Max PHPStan + all configured strict extensions
        run: composer stan
      - name: PHPUnit including CakePHP HTTP integration
        run: |
          set +e
          composer test -- --log-junit "$RUNNER_TEMP/phpunit.xml"
          result=$?
          if [ "$result" -ne 0 ] && [ -f "$RUNNER_TEMP/phpunit.xml" ]; then
            python3 - "$RUNNER_TEMP/phpunit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          for case in ET.parse(sys.argv[1]).iter("testcase"):
              for failure in (*case.findall("failure"), *case.findall("error")):
                  kind = failure.tag
                  print(f"::error title=PHPUnit {kind}::{case.get('classname', 'unknown')}::{case.get('name', 'unknown')}")
          PY
          fi
          exit "$result"
      - name: CakePHP style rules
        run: composer cs-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned JavaScript checker (CI only, never on hosting)
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
      - name: Browser-side syntax, strict JSDoc typing, and deterministic tests
        run: |
          node --check webroot/assets/js/app.js
          node --check webroot/assets/js/lab-core.js
          npx --no-install tsc --noEmit --allowJs --checkJs --strict --target ES2022 --lib ES2022,DOM webroot/assets/js/lab-core.js
          node --test tests/Client/*.test.cjs
      - name: Install and validate isolated production-only Composer dependencies (not a deployable release)
        run: |
          export LAB_PROD_STAGE="$RUNNER_TEMP/harfusha-production-stage"
          python3 -c 'from pathlib import Path; import os,sys; sys.path.insert(0, "scripts"); from release_package import stage_application; p=Path(os.environ["LAB_PROD_STAGE"]); p.mkdir(parents=True, exist_ok=True); stage_application(Path.cwd(), p)'
          (
            cd "$LAB_PROD_STAGE"
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
            composer check-platform-reqs --no-dev
          )
      - name: Record reviewed public-content approval and build deployable archive
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/review-public-content.py --approve --reviewer 'Adam Halfar'
          python3 scripts/build-release.py --output "$RUNNER_TEMP/harfusha-lab-deploy.zip"
          python3 scripts/verify_archive.py "$RUNNER_TEMP/harfusha-lab-deploy.zip" --variant production
      - name: Upload deployable archive
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harfusha-lab-deploy-${{ github.sha }}
          path: ${{ runner.temp }}/harfusha-lab-deploy.zip
          if-no-files-found: error
          retention-days: 1
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Pure browser-core regression tests
        run: node --test tests/Client/*.test.cjs
      - name: Public-data privacy heuristic
        run: python3 scripts/audit-public.py
      - name: Editorial, archive and HTTP smoke harness unit tests (not human approval)
        run: python3 -m unittest discover -s tests/Python -v
      - name: Reproducible source ZIP and independent SHA256 verification
        run: |
          python3 scripts/build-source.py --output "$RUNNER_TEMP/harfusha-lab-source.zip" --skip-tests
          python3 scripts/verify_archive.py "$RUNNER_TEMP/harfusha-lab-source.zip" --variant source

  browser-offline:
    # Playwright 1.56 Chromium binaries are not supported on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, mbstring
          coverage: none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned offline browser test tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser DOM, keyboard and responsive regression
        run: python3 tests/Browser/smoke.py
