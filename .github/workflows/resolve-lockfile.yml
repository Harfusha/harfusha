name: Resolve Composer lockfile on PHP 8.5 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_mysql, simplexml, openssl
          tools: composer:v2
          coverage: none
      - name: Verify patched PHP 8.5 and required extensions
        run: |
          php -r 'if (PHP_VERSION_ID < 80512 || PHP_VERSION_ID >= 80600) {fwrite(STDERR, "PHP 8.5.12+ required\n"); exit(1);}'
      - name: Resolve one dependency snapshot without executing package scripts
        run: |
          composer update --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          composer validate --strict --no-check-publish
          composer audit --locked
          composer check-platform-reqs
      - name: Export Composer lockfile for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composer-lock-php85
          path: composer.lock
          if-no-files-found: error
          retention-days: 7
