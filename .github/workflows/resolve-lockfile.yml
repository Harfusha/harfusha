name: Resolve Composer lockfile on PHP 8.5 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_mysql, simplexml, openssl
          tools: composer:v2
          coverage: none
      - name: Verify patched PHP 8.5 and required extensions
        run: |
          php -r 'if (PHP_VERSION_ID < 80512 || PHP_VERSION_ID >= 80600) {fwrite(STDERR, "PHP 8.5.12+ required\n"); exit(1);}'
      - name: Resolve one reviewed dependency snapshot
        run: |
          composer update --no-interaction --prefer-dist --no-progress
          composer validate --strict
          composer audit --locked
          composer check-platform-reqs
      - name: Export reproducible composer.lock for review and commit
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock-php85
          path: composer.lock
          if-no-files-found: error
          retention-days: 7
